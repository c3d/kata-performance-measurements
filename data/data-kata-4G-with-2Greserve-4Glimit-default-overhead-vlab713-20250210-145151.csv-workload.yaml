apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-deployment
  labels:
    app: workload

spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload
  template:
    metadata:
      labels:
        app: workload
    spec:
      runtimeClassName: kata
      containers:
      - name: workload
        image: quay.io/c3d/workload
        env:
        - name: CPU
          value: "1"
        - name: MEMORY
          value: "3900"
        - name: INCREMENT
          value: "100"
        resources:
          requests:
            memory: 2048Mi
          limits:
            memory: 4096Mi
